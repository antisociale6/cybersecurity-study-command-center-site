name: Revenue loop cloud guardian

on:
  push:
    branches:
      - gh-pages
  schedule:
    # Odd minutes reduce GitHub's documented top-of-hour scheduling delays.
    - cron: "7,22,37,52 * * * *"
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: quick
        type: choice
        options:
          - quick
          - deep

permissions:
  contents: write
  pages: write

concurrency:
  group: revenue-loop-cloud-guardian
  cancel-in-progress: false

jobs:
  guardian:
    name: Verify and recover the public funnel
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the published source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Select verification depth
        id: verification
        shell: bash
        run: |
          mode="quick"
          if [[ "${{ github.event.schedule }}" == "43 3 * * *" ]]; then
            mode="deep"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Allow a branch-triggered Pages deployment to settle
        if: github.event_name == 'push'
        run: sleep 60

      - name: Load the durable commerce contract
        id: commerce_contract
        shell: bash
        run: |
          lock_message="Lock verified Gumroad commerce readiness [skip ci]"
          if git log --format=%s --fixed-strings --grep="$lock_message" -1 | grep -Fxq "$lock_message"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the first health check
        id: first_check
        shell: bash
        env:
          SITE_URL: https://antisociale6.github.io/cybersecurity-study-command-center-site/
          CHECKOUT_URL: https://corcoran7.gumroad.com/l/vmyfq
          LEAD_MAGNET_URL: https://corcoran7.gumroad.com/l/vlcjuo
          REQUIRE_COMMERCE_READY: ${{ steps.commerce_contract.outputs.required }}
        run: |
          set +e
          node .github/scripts/site-health.mjs \
            --mode "${{ steps.verification.outputs.mode }}" \
            --output health-result.json
          exit_code="$?"
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Request a Pages rebuild after an operational failure
        if: steps.first_check.outputs.exit_code == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/site-health.mjs --request-pages-rebuild

      - name: Wait for the recovery deployment and recheck
        if: steps.first_check.outputs.exit_code == '1'
        shell: bash
        env:
          SITE_URL: https://antisociale6.github.io/cybersecurity-study-command-center-site/
          CHECKOUT_URL: https://corcoran7.gumroad.com/l/vmyfq
          LEAD_MAGNET_URL: https://corcoran7.gumroad.com/l/vlcjuo
          REQUIRE_COMMERCE_READY: ${{ steps.commerce_contract.outputs.required }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node .github/scripts/site-health.mjs \
              --mode "${{ steps.verification.outputs.mode }}" \
              --output health-result-after-recovery.json; then
              exit 0
            fi
            if [[ "$attempt" != "6" ]]; then
              sleep 20
            fi
          done
          exit 1

      - name: Fail closed if verified commerce regresses
        if: steps.first_check.outputs.exit_code == '2'
        run: exit 1

      - name: Lock the first verified commerce-ready state
        if: steps.first_check.outputs.exit_code == '0' && steps.first_check.outputs.commerce_ready == 'true' && steps.first_check.outputs.commerce_contract_ok == 'true' && steps.commerce_contract.outputs.required != 'true'
        shell: bash
        run: |
          git config user.name "OpenClaw Cloud Guardian"
          git config user.email "openclaw-cloud-guardian@localhost"
          git commit --allow-empty -m "Lock verified Gumroad commerce readiness [skip ci]"
          git push

      - name: Keep the public-repository schedule active
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          heartbeat_message="$(node .github/scripts/site-health.mjs --heartbeat-message)"
          if git log --format=%s --fixed-strings --grep="$heartbeat_message" -1 | grep -Fxq "$heartbeat_message"; then
            exit 0
          fi
          git config user.name "OpenClaw Cloud Guardian"
          git config user.email "openclaw-cloud-guardian@localhost"
          git commit --allow-empty -m "$heartbeat_message"
          git push
